<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Etiqueta Reversa Rede</title>

  <!-- QRCode lib -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body{ margin:0; padding:20px; background:#f4f4f4; font-family:Arial, sans-serif; }
    .card{ background:#fff; max-width:1000px; margin:auto; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,.15); }
    h1{ text-align:center; color:#003366; }
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:15px; }
    input,select{ width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; }
    label{ font-weight:bold; display:block; margin-bottom:5px; }
    button{ margin-top:20px; background:#0055cc; color:white; border:none; padding:12px 20px; cursor:pointer; border-radius:5px; }
    button:hover{ background:#003c91; }

    /* impressão: remover margens do page (ajuda no preview; algumas impressoras ignoram) */
    @page { size: A4; margin: 0; }

    /* layout fixo em duas colunas: coluna esquerda fixa para o quadrado (agora embaixo) */
    .etiqueta{
      width:180mm;
      height:120mm;
      border:3px solid black;
      margin:0 auto 20px auto;
      background:white;
      page-break-after:always;
      box-sizing:border-box;
      padding:6mm;
      display:grid;
      grid-template-columns: 80mm 1fr;
      grid-template-rows: auto auto 1fr auto; /* top content, cole-box, middle (volume/dados/qrs), footer */
      gap:6mm;
      page-break-inside: avoid;
    }

    /* Conteúdo na primeira linha, segunda coluna */
    .content-box{
      grid-column: 2 / 3;
      grid-row: 1 / 2;
      min-width:0;
    }

    /* Quadrado “cole aqui” - agora abaixo, ocupando largura total */
    .cole-box{
      grid-column: 1 / 3; /* ocupa ambas as colunas */
      grid-row: 2 / 3;
      width:100%;
      height:40mm; /* altura menor para caber em A4 sem cortar */
      border:2px dashed #000;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-weight:bold;
      font-size:14px;
      box-sizing:border-box;
      padding:6px;
    }

    /* Faixa e título */
    .faixa{ border-bottom:2px solid black; text-align:center; padding:6px 0; font-weight:bold; font-size:14px; }
    .titulo{ font-size:30px; font-weight:700; padding:6px 0; text-align:center; }

    /* Campos preenchidos maiores */
    .info{ padding:0 6px; }
    .info div{ margin:6px 0; font-size:16px; }
    .info b{ font-size:15px; }
    .fill{ font-size:28px; font-weight:800; margin-left:8px; }

    /* Volume e valores grandes (OS / NF) placed in third row, second column */
    .volume{ text-align:center; font-size:26px; font-weight:bold; grid-column: 2 / 3; grid-row: 3 / 4; }
    .dados{ display:flex; justify-content:space-around; margin-top:6mm; grid-column: 2 / 3; grid-row: 3 / 4; }
    .valor{ font-size:48px; font-weight:900; }

    /* QRs: wrapper larger, also in third row */
    .qrs{ grid-column: 2 / 3; grid-row: 3 / 4; display:flex; gap:16mm; justify-content:center; align-items:flex-end; margin-top:6mm; }
    .qr-wrap{ width:36mm; height:36mm; display:flex; align-items:center; justify-content:center; }

    /* Certificar que o elemento gerado pela lib ocupa o wrapper */
    .qr-wrap img, .qr-wrap canvas, .qr-wrap table { max-width:100%; max-height:100%; width:auto; height:auto; display:block; }

    /* Rodapé full width */
    .rodape{ grid-column: 1 / 3; grid-row: 4 / 5; text-align:center; color:red; font-size:18px; font-weight:bold; margin-top:6mm; }

    /* Responsivo para telas pequenas: empilha (cole-box fica abaixo naturalmente) */
    @media (max-width:1200px){
      .etiqueta{ display:flex; flex-direction:column; padding:6mm; height:auto; }
      .cole-box{ width:100%; height:36mm; }
      .qr-wrap{ width:28mm; height:28mm; }
    }

    /* evitar sombras no print */
    @media print{ .card{ box-shadow:none; } .no-print{ display:none; } body{ background:white; } }
  </style>
</head>
<body>
  <div class="card no-print">
    <h1>Etiqueta Reversa Rede</h1>

    <div class="grid">
      <div>
        <label>Destino</label>
        <input id="destino" type="text" placeholder="Ex: Polo ABC" />
      </div>

      <div>
        <label>Remetente</label>
        <input id="remetente" type="text" placeholder="Ex: Empresa X" />
      </div>

      <div>
        <label>Polo Origem</label>
        <input id="origem" type="text" placeholder="Ex: Polo Y" />
      </div>

      <div>
        <label>OS</label>
        <input id="os" type="text" placeholder="Número da OS" />
      </div>

      <div>
        <label>NF</label>
        <input id="nf" type="text" placeholder="Número da Nota Fiscal" />
      </div>

      <div>
        <label>Quantidade de Caixas</label>
        <input id="qtd" type="number" min="1" value="1" />
      </div>
    </div>

    <button onclick="gerarEtiquetas()">Gerar Etiquetas</button>
    <button onclick="window.print()">Imprimir</button>
  </div>

  <div id="resultado"></div>

  <script>
    function gerarEtiquetas(){
      const destino = document.getElementById('destino').value || '-';
      const remetente = document.getElementById('remetente').value || '-';
      const origem = document.getElementById('origem').value || '-';
      const os = document.getElementById('os').value || '-';
      const nf = document.getElementById('nf').value || '-';
      let qtd = parseInt(document.getElementById('qtd').value, 10);
      if (isNaN(qtd) || qtd < 1) qtd = 1;
      if (qtd > 50) { if(!confirm('Você pediu mais de 50 etiquetas. Continuar?')) return; }

      let html = '';
      for (let i = 1; i <= qtd; i++) {
        html += `
<div class="etiqueta">

  <div class="content-box">
    <div class="faixa">TRANSPORTE - COLE SUA ETIQUETA AQUI</div>
    <div class="titulo">REVERSA - REDE</div>

    <div class="info">
      <div><b>DESTINO:</b><span class="fill"> ${escapeHtml(destino)}</span></div>
      <div><b>REMETENTE:</b><span class="fill"> ${escapeHtml(remetente)}</span></div>
      <div><b>POLO ORIGEM:</b><span class="fill"> ${escapeHtml(origem)}</span></div>
      <div><b>CONFERÊNCIA:</b><span class="fill"> OS ${escapeHtml(os)} | NF ${escapeHtml(nf)}</span></div>
    </div>
  </div>

  <div class="cole-box">TRANSPORTE<br><span style="font-size:12px">COLE SUA ETIQUETA AQUI</span></div>

  <div class="volume">VOLUME DE CAIXA ${i}/${qtd}</div>

  <div class="dados">
    <div class="bloco">
      <div>OS</div>
      <div class="valor">${escapeHtml(os)}</div>
    </div>

    <div class="bloco">
      <div>NF</div>
      <div class="valor">${escapeHtml(nf)}</div>
    </div>
  </div>

  <div class="qrs">
    <div class="qr-wrap" id="qros${i}"></div>
    <div class="qr-wrap" id="qrnf${i}"></div>
  </div>

  <div class="rodape">MANUSEAR COM CUIDADO</div>
</div>
`;
      }

      const resultado = document.getElementById('resultado');
      resultado.innerHTML = html;

      // gerar QRCodes depois do innerHTML
      for (let i = 1; i <= qtd; i++) {
        const elemOs = document.getElementById(`qros${i}`);
        const elemNf = document.getElementById(`qrnf${i}`);

        if (elemOs) {
          elemOs.innerHTML = '';
          const sizeOs = Math.floor(Math.min(elemOs.clientWidth, elemOs.clientHeight));
          new QRCode(elemOs, { text: `OS:${os}|vol:${i}/${qtd}`, width: sizeOs, height: sizeOs });
        }
        if (elemNf) {
          elemNf.innerHTML = '';
          const sizeNf = Math.floor(Math.min(elemNf.clientWidth, elemNf.clientHeight));
          new QRCode(elemNf, { text: `NF:${nf}|vol:${i}/${qtd}`, width: sizeNf, height: sizeNf });
        }
      }
    }

    // pequena função para escapar HTML (evita injeção simples)
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
