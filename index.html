<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Etiqueta Reversa Rede</title>

  <!-- QRCode lib -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body{ margin:0; padding:10px; background:#f4f4f4; font-family:Arial, sans-serif; }
    .card{ background:#fff; max-width:1000px; margin:auto; padding:12px; border-radius:6px; box-shadow:0 0 6px rgba(0,0,0,.12); }
    h1{ text-align:center; color:#003366; }
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    input,select{ width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; }
    label{ font-weight:bold; display:block; margin-bottom:6px; }
    button{ margin-top:12px; background:#0055cc; color:white; border:none; padding:10px 16px; cursor:pointer; border-radius:6px; }
    button:hover{ background:#003c91; }

    /* Página/impressão em A4: etiqueta com duas áreas iguais (metade/metade) */
    @page { size: A4; margin: 0; }

    .etiqueta{
      width:180mm;
      height:120mm;            /* total height */
      border:3px solid black;
      margin:8px auto 20px auto;
      background:white;
      page-break-after:always;
      box-sizing:border-box;
      padding:4mm;             /* small outer padding */
      display:grid;
      grid-template-columns: 1fr;
      grid-template-rows: 60mm 60mm; /* EQUAL halves: top = cole, bottom = content */
      gap:4mm;
      page-break-inside: avoid;
    }

    /* Cole box (top) full width - larger now */
    .cole-box{
      grid-column: 1 / 2;
      grid-row: 1 / 2;
      width:100%;
      height:100%;
      border:2px dashed #000;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-weight:bold;
      font-size:16px;
      box-sizing:border-box;
      padding:6px;
    }

    /* Content box (bottom) full width */
    .content-box{
      grid-column: 1 / 2;
      grid-row: 2 / 3;
      padding:6mm 8mm;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .header-row{ }
    .faixa{ border-bottom:2px solid black; text-align:center; padding:4px 0; font-weight:bold; font-size:12px; }
    .titulo{ font-size:22px; font-weight:700; padding:6px 0; text-align:left; }

    .info{ padding:0; }
    .info div{ margin:4px 0; font-size:13px; }
    .info b{ font-size:12px; }
    .fill{ font-size:20px; font-weight:700; margin-left:6px; }

    .volume{ text-align:center; font-size:18px; font-weight:bold; margin-top:6px; }
    .dados{ display:flex; justify-content:space-around; align-items:center; margin-top:6px; }
    .bloco{ text-align:center; }
    .valor{ font-size:34px; font-weight:800; }

    .qrs{ display:flex; gap:12mm; justify-content:center; align-items:flex-end; margin-top:6mm; }
    .qr-wrap{ width:30mm; height:30mm; display:flex; align-items:center; justify-content:center; }
    .qr-wrap img, .qr-wrap canvas, .qr-wrap table { max-width:100%; max-height:100%; display:block; }

    .rodape{ text-align:center; color:red; font-size:14px; font-weight:bold; margin-top:6px; }

    @media print{ .card{ box-shadow:none; } .no-print{ display:none; } body{ background:white; } }
    @media (max-width:1200px){ .etiqueta{ width:100%; height:auto; grid-template-rows: auto auto; } .cole-box{ height:48mm; } }
  </style>
</head>
<body>
  <div class="card no-print">
    <h1>Etiqueta Reversa Rede</h1>

    <div class="grid">
      <div>
        <label>Destino</label>
        <input id="destino" type="text" placeholder="Ex: Polo ABC" />
      </div>

      <div>
        <label>Remetente</label>
        <input id="remetente" type="text" placeholder="Ex: Empresa X" />
      </div>

      <div>
        <label>Polo Origem</label>
        <input id="origem" type="text" placeholder="Ex: Polo Y" />
      </div>

      <div>
        <label>OS</label>
        <input id="os" type="text" placeholder="Número da OS" />
      </div>

      <div>
        <label>NF</label>
        <input id="nf" type="text" placeholder="Número da Nota Fiscal" />
      </div>

      <div>
        <label>Quantidade de Caixas</label>
        <input id="qtd" type="number" min="1" value="1" />
      </div>
    </div>

    <button onclick="gerarEtiquetas()">Gerar Etiquetas</button>
    <button onclick="window.print()">Imprimir</button>
  </div>

  <div id="resultado"></div>

  <script>
    function gerarEtiquetas(){
      const destino = document.getElementById('destino').value || '-';
      const remetente = document.getElementById('remetente').value || '-';
      const origem = document.getElementById('origem').value || '-';
      const os = document.getElementById('os').value || '-';
      const nf = document.getElementById('nf').value || '-';
      let qtd = parseInt(document.getElementById('qtd').value, 10);
      if (isNaN(qtd) || qtd < 1) qtd = 1;
      if (qtd > 50) { if(!confirm('Você pediu mais de 50 etiquetas. Continuar?')) return; }

      let html = '';
      for (let i = 1; i <= qtd; i++) {
        html += `
<div class="etiqueta">
  <div class="cole-box">TRANSPORTE<br><span style="font-size:12px">COLE SUA ETIQUETA AQUI</span></div>

  <div class="content-box">
    <div class="header-row">
      <div class="faixa">TRANSPORTE - COLE SUA ETIQUETA AQUI</div>
      <div class="titulo">REVERSA - REDE</div>

      <div class="info">
        <div><b>DESTINO:</b><span class="fill"> ${escapeHtml(destino)}</span></div>
        <div><b>REMETENTE:</b><span class="fill"> ${escapeHtml(remetente)}</span></div>
        <div><b>POLO ORIGEM:</b><span class="fill"> ${escapeHtml(origem)}</span></div>
        <div><b>CONFERÊNCIA:</b><span class="fill"> OS ${escapeHtml(os)} | NF ${escapeHtml(nf)}</span></div>
      </div>
    </div>

    <div>
      <div class="volume">VOLUME DE CAIXA ${i}/${qtd}</div>

      <div class="dados">
        <div class="bloco">
          <div>OS</div>
          <div class="valor">${escapeHtml(os)}</div>
        </div>

        <div class="bloco">
          <div>NF</div>
          <div class="valor">${escapeHtml(nf)}</div>
        </div>
      </div>

      <div class="qrs">
        <div class="qr-wrap" id="qros${i}"></div>
        <div class="qr-wrap" id="qrnf${i}"></div>
      </div>

      <div class="rodape">MANUSEAR COM CUIDADO</div>
    </div>
  </div>
</div>
`;
      }

      const resultado = document.getElementById('resultado');
      resultado.innerHTML = html;

      // gerar QRCodes depois do innerHTML
      for (let i = 1; i <= qtd; i++) {
        const elemOs = document.getElementById(`qros${i}`);
        const elemNf = document.getElementById(`qrnf${i}`);

        if (elemOs) {
          elemOs.innerHTML = '';
          const sizeOs = Math.floor(Math.min(elemOs.clientWidth, elemOs.clientHeight));
          new QRCode(elemOs, { text: `OS:${os}|vol:${i}/${qtd}`, width: sizeOs, height: sizeOs });
        }
        if (elemNf) {
          elemNf.innerHTML = '';
          const sizeNf = Math.floor(Math.min(elemNf.clientWidth, elemNf.clientHeight));
          new QRCode(elemNf, { text: `NF:${nf}|vol:${i}/${qtd}`, width: sizeNf, height: sizeNf });
        }
      }
    }

    // pequena função para escapar HTML (evita injeção simples)
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
